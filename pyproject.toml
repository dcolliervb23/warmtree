[project]
name = "warmtree"
version = "0.4.0"
description = "A pool of pre-warmed git worktrees for parallel AI coding agents."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Dan Collier" }]
keywords = ["git", "worktree", "agents", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.scripts]
warmtree = "warmtree.cli:main"

[project.urls]
Homepage = "https://github.com/dcolliervb23/warmtree"
Changelog = "https://github.com/dcolliervb23/warmtree/releases"
Issues = "https://github.com/dcolliervb23/warmtree/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["warmtree"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
